<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropdown states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6D18BD}a:hover{color:#4E0F8A}
.ipInput:focus{outline:none}
.ipInput::placeholder{color:#7A7F87}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto auto; gap: 28px 40px; align-content: start; font-family: 'Nunito Sans', system-ui, sans-serif; color: #15171A; background: #F4F5F7; font-variant-numeric: tabular-nums">
  <sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #5B6068">{{b.caption}}</h2>
      <div role="dialog" aria-label="{{b.caption}}" style="background: #FFFFFF; border: 1px solid #DADDE2; border-radius: 12px; box-shadow: 0 18px 48px rgba(21,23,26,.12), 0 2px 6px rgba(21,23,26,.05); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #ECEDF0">
          <span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 14px; font-size: 12px; font-weight: 700; background: {{b.tint}}; color: {{b.ink}}">
            <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{b.color}}"></span>{{b.chName}}
          </span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6068" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <label style="flex: 1 1 auto; min-width: 0; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search by RIC or name</span>
            <input class="ipInput" value="{{b.query}}" readOnly="{{ true }}" placeholder="Search RIC or name…" style="flex: 1 1 auto; min-width: 0; height: 32px; border: 0; background: transparent; font: 600 16px 'Nunito Sans', sans-serif; color: #15171A">
          </label>
          <kbd style="font: 600 11px 'Nunito Sans', sans-serif; color: #5B6068; border: 1px solid #DADDE2; border-bottom-width: 2px; border-radius: 5px; padding: 2px 6px">Esc</kbd>
        </div>

        <sc-for list="{{b.sections}}" as="sec" hint-placeholder-count="1">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5B6068">
            <span>{{sec.label}}</span><span style="text-transform: none; letter-spacing: 0; font-weight: 600">{{sec.count}}</span>
          </div>
          <div role="listbox" aria-label="{{sec.label}}" style="padding: 2px 6px 6px">
            <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="3">
              <button type="button" role="option" aria-selected="{{r.currentStr}}" style="width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) 104px 84px 92px; column-gap: 14px; align-items: center; min-height: 54px; padding: 7px 12px; box-sizing: border-box; border: 0; border-radius: 8px; text-align: left; font-family: inherit; color: #15171A; background: {{r.bg}}; box-shadow: {{r.ring}}">
                <span aria-hidden="true" style="display: flex; flex-direction: column; gap: 3px; align-items: center">
                  <sc-for list="{{r.dots}}" as="d"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{d.color}}"></span></sc-for>
                </span>
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                  <span style="display: flex; align-items: center; gap: 8px">
                    <span style="font-size: 15px; font-weight: 700">{{r.ricA}}<mark style="background: #EADCFB; color: #15171A; border-radius: 3px; padding: 0 1px">{{r.ricB}}</mark>{{r.ricC}}</span>
                    <sc-if value="{{r.hasPhase}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: {{r.phaseBg}}; color: {{r.phaseInk}}">{{r.phase}}</span></sc-if>
                  </span>
                  <span style="font-size: 12px; color: #5B6068; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.descA}}<mark style="background: #EADCFB; color: #15171A; border-radius: 3px; padding: 0 1px">{{r.descB}}</mark>{{r.descC}} · XLON · GBp</span>
                </span>
                <span style="display: flex; flex-direction: column; gap: 5px">
                  <span style="position: relative; height: 4px; border-radius: 2px; background: #E6E8EC">
                    <span style="position: absolute; top: -3px; width: 2px; height: 10px; border-radius: 1px; background: #8A8F97; left: {{r.closePos}}"></span>
                    <span style="position: absolute; top: -2px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #15171A; left: {{r.lastPos}}"></span>
                  </span>
                  <span style="display: flex; justify-content: space-between; font-size: 11px; color: #5B6068"><span>{{r.low}}</span><span>{{r.high}}</span></span>
                </span>
                <span style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; align-items: flex-end">
                  <span><span style="color: #5B6068">B </span><span style="font-weight: 600">{{r.bid}}</span></span>
                  <span><span style="color: #5B6068">A </span><span style="font-weight: 600">{{r.ask}}</span></span>
                </span>
                <span style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end">
                  <span style="font-size: 16px; font-weight: 700; padding: 0 5px; margin-right: -5px; border-radius: 4px; background: {{r.flashBg}}; opacity: {{r.opacity}}">{{r.last}}</span>
                  <span style="display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: {{r.chgColor}}">
                    <sc-if value="{{r.up}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="8" height="8" viewBox="0 0 8 8"><path d="M4 1l3.5 5.5h-7z" fill="currentColor"></path></svg></sc-if>
                    <sc-if value="{{r.down}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="8" height="8" viewBox="0 0 8 8"><path d="M4 7L.5 1.5h7z" fill="currentColor"></path></svg></sc-if>
                    {{r.chg}}
                  </span>
                </span>
              </button>
            </sc-for>
          </div>
        </sc-for>

        <sc-if value="{{b.empty}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 40px 24px 36px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
            <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8A8F97" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5M8.5 11h5"></path></svg>
            <span style="font-size: 14px; font-weight: 700">No instruments match “{{b.query}}”</span>
            <span style="font-size: 12px; color: #5B6068">Search matches the start of a RIC or any word in the name.</span>
          </div>
        </sc-if>

        <sc-if value="{{b.loading}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 8px 18px 14px; display: flex; flex-direction: column; gap: 0">
            <sc-for list="{{b.skeleton}}" as="k" hint-placeholder-count="3">
              <div style="display: grid; grid-template-columns: minmax(0, 1fr) 104px 92px; column-gap: 14px; align-items: center; height: 54px">
                <span style="display: flex; flex-direction: column; gap: 6px"><span style="height: 10px; border-radius: 3px; background: #ECEDF0; width: {{k.w1}}"></span><span style="height: 8px; border-radius: 3px; background: #F1F2F4; width: {{k.w2}}"></span></span>
                <span style="height: 4px; border-radius: 2px; background: #ECEDF0"></span>
                <span style="height: 12px; border-radius: 3px; background: #ECEDF0; justify-self: end; width: 64px"></span>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid #ECEDF0; background: #FAFAFB; font-size: 12px; color: #5B6068">
          <span style="display: flex; gap: 14px">
            <span><kbd style="font: 700 11px 'Nunito Sans', sans-serif; border: 1px solid #DADDE2; border-radius: 4px; padding: 0 5px; background: #FFFFFF">↑↓</kbd> move</span>
            <span><kbd style="font: 700 11px 'Nunito Sans', sans-serif; border: 1px solid #DADDE2; border-radius: 4px; padding: 0 5px; background: #FFFFFF">↵</kbd> link to {{b.chName}}</span>
            <span><kbd style="font: 700 11px 'Nunito Sans', sans-serif; border: 1px solid #DADDE2; border-radius: 4px; padding: 0 5px; background: #FFFFFF">Tab</kbd> switch channel</span>
          </span>
          <span>{{b.status}}</span>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var CH = {
  red: { name: 'Red', color: '#D9363E', tint: '#FCE8E9', ink: '#9E1E25' },
  green: { name: 'Green', color: '#1F9D55', tint: '#E3F4EA', ink: '#126B38' },
  blue: { name: 'Blue', color: '#2B6FD6', tint: '#E4EDFB', ink: '#1B4E9E' },
  yellow: { name: 'Yellow', color: '#D4A106', tint: '#FBF1D3', ink: '#7A5C00' }
};
/* ric, desc, last, close, low, high, dec, phase, channels */
var I = {
  'AAL.L': ['Anglo American', 438.1, 436.4, 434.9, 441.2, 1, 'Open', ['red']],
  'BARC.L': ['Barclays', 229.1, 227.4, 226.6, 230.4, 1, 'Open', ['green']],
  'VOD.L': ['Vodafone Group', 71.42, 71.88, 71.05, 72.31, 2, 'Open', ['blue']],
  'BP.L': ['BP', 452.35, 449.9, 448.2, 455.0, 2, 'Open', []],
  'HSBA.L': ['HSBC Holdings', 684.2, 680.0, 677.4, 686.9, 1, 'Open', []],
  'BA.L': ['BAE Systems', 1312.5, 1298.0, 1294.0, 1318.0, 1, 'Open', []],
  'BAB.L': ['Babcock International', 512.0, 509.5, 506.0, 515.5, 1, 'Auction', []],
  'BARC.L2': null,
  'BAG.L': ['A.G. Barr', 612.0, 612.0, 606.0, 619.0, 1, 'Halted', []],
  'BATS.L': ['British American Tobacco', 2864.0, 2881.0, 2852.0, 2893.0, 1, 'Open', []]
};
function split(s, q) {
  if (!q) return ['', '', s];
  var i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return [s, '', ''];
  return [s.slice(0, i), s.slice(i, i + q.length), s.slice(i + q.length)];
}
function row(ric, o) {
  o = o || {};
  var d = I[ric], dec = d[5], last = d[1], close = d[2], low = d[3], high = d[4], span = high - low;
  var pct = (last - close) / close * 100, halted = d[6] === 'Halted', q = o.q || '';
  var ricMatch = q && ric.toLowerCase().indexOf(q.toLowerCase()) === 0;
  var rs = ricMatch ? split(ric, q) : ['', '', ric];
  var ds = q && !ricMatch ? split(d[0], q) : ['', '', d[0]];
  var tickSz = Math.pow(10, -dec) * (dec === 2 ? 5 : 1);
  var tint = o.current ? CH[o.ch].tint : 'transparent';
  return {
    ricA: rs[0], ricB: rs[1], ricC: rs[2], descA: ds[0], descB: ds[1], descC: ds[2],
    dots: d[7].map(function (c) { return { color: CH[c].color }; }),
    hasPhase: d[6] !== 'Open', phase: d[6], phaseBg: halted ? '#FCE8E9' : '#FBF1D3', phaseInk: halted ? '#9E1E25' : '#7A5C00',
    bg: o.hi ? '#EEF0F4' : tint, ring: o.current ? 'inset 0 0 0 1px ' + CH[o.ch].color : 'none',
    currentStr: o.current ? 'true' : 'false',
    low: low.toFixed(dec), high: high.toFixed(dec),
    lastPos: ((last - low) / span * 100).toFixed(1) + '%', closePos: ((close - low) / span * 100).toFixed(1) + '%',
    bid: halted ? '—' : (last - tickSz).toFixed(dec), ask: halted ? '—' : (last + tickSz).toFixed(dec),
    last: last.toFixed(dec), opacity: halted ? '0.45' : '1',
    flashBg: o.flash === 'up' ? '#D5F0E0' : o.flash === 'down' ? '#FADCDC' : 'transparent',
    chg: (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%', up: pct > 0, down: pct < 0,
    chgColor: pct > 0 ? '#12804A' : pct < 0 ? '#C62828' : '#5B6068'
  };
}
function box(ch, o) {
  var c = CH[ch];
  return Object.assign({ chName: c.name, color: c.color, tint: c.tint, ink: c.ink, query: '', sections: [], empty: false, loading: false, skeleton: [], status: 'Prices live' }, o);
}
class Component extends DCLogic {
  renderVals() {
    return {
      boxes: [
        box('green', {
          caption: '1 · Opened, nothing typed',
          sections: [
            { label: 'In your channels', count: '', rows: [row('BARC.L', { ch: 'green', current: true }), row('AAL.L', { ch: 'green', flash: 'up' }), row('VOD.L', { ch: 'green' })] },
            { label: 'Recent', count: '', rows: [row('BP.L', { ch: 'green', hi: true }), row('HSBA.L', { ch: 'green', flash: 'down' })] }
          ]
        }),
        box('green', {
          caption: '2 · Typing “ba”: RIC prefix first, then name',
          query: 'ba',
          sections: [
            { label: 'Matches', count: '6 of 214', rows: [
              row('BA.L', { ch: 'green', q: 'ba', hi: true, flash: 'up' }), row('BAB.L', { ch: 'green', q: 'ba' }),
              row('BAG.L', { ch: 'green', q: 'ba' }), row('BARC.L', { ch: 'green', q: 'ba', current: true }),
              row('BATS.L', { ch: 'green', q: 'ba', flash: 'down' })
            ] }
          ]
        }),
        box('yellow', { caption: '3 · No match', query: 'bxq', empty: true, status: '0 of 214' }),
        box('yellow', { caption: '4 · Waiting for the first rows', query: 'hs', loading: true, status: 'Searching…', skeleton: [{ w1: '28%', w2: '52%' }, { w1: '36%', w2: '44%' }, { w1: '24%', w2: '58%' }] })
      ]
    };
  }
}
</script>
</body>
</html>
