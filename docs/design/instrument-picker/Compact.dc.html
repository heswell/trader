<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact picker variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6D18BD}a:hover{color:#4E0F8A}
</style>
</helmet>
<div style="width: 1440px; height: 820px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; gap: 36px; font-family: 'Nunito Sans', system-ui, sans-serif; color: #15171A; background: #F4F5F7; font-variant-numeric: tabular-nums">

  <!-- Variants -->
  <section style="display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #5B6068">Layout rule · B, else A, else dots · Green is the active channel</h2>
    <sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
      <div style="display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: center; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 800">{{v.name}}</span>
          <span style="font-size: 12px; color: #5B6068">{{v.sub}}</span>
        </div>
        <div style="height: 56px; position: relative; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 8px; box-shadow: inset 0 -2px 0 #1F9D55; display: flex; align-items: center; justify-content: center">
          <div style="height: 36px; display: flex; align-items: stretch; gap: 2px; padding: 3px; box-sizing: border-box; border: 1px solid #DADDE2; border-radius: 10px; background: #F1F2F5">
            <sc-for list="{{v.segs}}" as="c" hint-placeholder-count="4">
              <div style="display: flex; align-items: stretch; border-radius: 7px; overflow: hidden; background: {{c.bg}}; box-shadow: {{c.shadow}}">
                <button type="button" aria-label="{{c.aria}}" style="display: flex; align-items: center; gap: 8px; padding: 0 {{c.pad}}; border: 0; background: transparent; font-family: inherit; color: #15171A">
                  <span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; background: {{c.dotFill}}; border: 2px solid {{c.color}}"></span>
                  <sc-if value="{{c.showLabel}}" hint-placeholder-val="{{ true }}"><span style="font-weight: {{c.weight}}; font-size: 13px; color: {{c.labelColor}}">{{c.label}}</span></sc-if>
                  <sc-if value="{{c.showPrice}}" hint-placeholder-val="{{ false }}">
                    <span style="font-size: 12px; color: #3E434A; padding: 1px 4px; border-radius: 4px; background: {{c.flashBg}}">{{c.lastStr}}</span>
                    <span style="font-size: 11px; font-weight: 700; color: {{c.chgColor}}">{{c.chgStr}}</span>
                  </sc-if>
                </button>
                <sc-if value="{{c.isActive}}" hint-placeholder-val="{{ false }}">
                  <button type="button" aria-label="Search instruments" style="width: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-left: 1px solid #ECEDF0; background: {{c.searchBg}}; color: #3E434A">
                    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
                  </button>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-for>

  </section>

  <!-- Segment states -->
  <section style="display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #5B6068">Segment states · variant B</h2>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{states}}" as="s" hint-placeholder-count="8">
        <div style="background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
          <div style="height: 36px; display: flex; align-items: stretch; padding: 3px; box-sizing: border-box; border: 1px solid #DADDE2; border-radius: 10px; background: #F1F2F5">
            <div style="display: flex; align-items: stretch; border-radius: 7px; overflow: hidden; background: {{s.bg}}; box-shadow: {{s.shadow}}">
              <button type="button" aria-label="{{s.title}}" style="display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: transparent; font-family: inherit; color: #15171A">
                <span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; background: {{s.dotFill}}; border: 2px solid {{s.color}}"></span>
                <span style="font-weight: {{s.weight}}; font-size: 13px; color: {{s.labelColor}}">{{s.label}}</span>
                <sc-if value="{{s.showPrice}}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 12px; color: #3E434A; padding: 1px 4px; border-radius: 4px; background: {{s.flashBg}}">{{s.lastStr}}</span>
                  <span style="font-size: 11px; font-weight: 700; color: {{s.chgColor}}">{{s.chgStr}}</span>
                </sc-if>
              </button>
              <sc-if value="{{s.isActive}}" hint-placeholder-val="{{ false }}">
                <button type="button" aria-label="Search instruments" style="width: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-left: 1px solid #ECEDF0; background: {{s.searchBg}}; color: #3E434A">
                  <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
                </button>
              </sc-if>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; font-weight: 800">{{s.title}}</span>
            <span style="font-size: 12px; color: #5B6068; line-height: 1.4">{{s.note}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
var CH = [
  { name: 'Red', color: '#D9363E', tint: '#FCE8E9', ric: 'AAL.L', last: '438.1', chg: '+0.39%', up: true },
  { name: 'Green', color: '#1F9D55', tint: '#E3F4EA', ric: 'BARC.L', last: '229.1', chg: '+0.75%', up: true },
  { name: 'Blue', color: '#2B6FD6', tint: '#E4EDFB', ric: 'VOD.L', last: '71.42', chg: '-0.64%', up: false },
  { name: 'Yellow', color: '#D4A106', tint: '#FBF1D3', ric: null }
];
function seg(c, o) {
  o = o || {};
  var active = !!o.active, has = !!c.ric;
  return {
    color: c.color, dotFill: has ? c.color : 'transparent',
    label: has ? c.ric : 'Link…', labelColor: has ? (active ? '#15171A' : '#3E434A') : '#5B6068',
    weight: active ? 800 : 700,
    bg: o.hover ? '#FFFFFF' : active ? '#FFFFFF' : 'transparent',
    shadow: active ? '0 0 0 1.5px ' + c.color + ', 0 1px 3px rgba(21,23,26,.14)' : o.hover ? '0 1px 2px rgba(21,23,26,.08)' : 'none',
    isActive: active, searchBg: o.open ? c.tint : 'transparent',
    showLabel: o.dotOnly ? active : true,
    pad: o.dotOnly && !active ? '10px' : '12px',
    showPrice: !!(has && o.prices && (!o.dotOnly || active)),
    lastStr: c.last || '', chgStr: c.chg || '', chgColor: c.up ? '#12804A' : '#C62828',
    flashBg: o.flash === 'up' ? '#D5F0E0' : o.flash === 'down' ? '#FADCDC' : 'transparent',
    aria: c.name + ' channel, ' + (c.ric || 'no instrument')
  };
}
class Component extends DCLogic {
  renderVals() {
    var mk = function (o) { return CH.map(function (c, i) { return seg(c, { active: i === 1, prices: o.prices, dotOnly: o.dotOnly }); }); };
    return {
      variants: [
        { name: 'B · Default', sub: 'Dot, RIC, live last and change. Used whenever all four channels fit.', segs: mk({ prices: true }) },
        { name: 'A · Fallback', sub: 'Prices drop out when B would not fit. Live prices stay in the dropdown.', segs: mk({ prices: false }) },
        { name: 'Dots · Last resort', sub: 'If even A does not fit: inactive channels shrink to dots, the active one keeps its RIC.', segs: mk({ prices: false, dotOnly: true }) }
      ],
      tabs: CH.map(function (c, i) {
        var active = i === 1;
        return {
          color: c.color, dotFill: c.ric ? c.color : 'transparent', label: c.ric || 'Link…', isActive: active,
          labelColor: c.ric ? '#15171A' : '#5B6068', weight: active ? 800 : 700,
          topColor: active ? c.color : 'transparent', bg: active ? c.tint : 'transparent',
          lastStr: c.ric ? c.last : 'No instrument', chgStr: c.ric ? c.chg : '', chgColor: c.up ? '#12804A' : '#C62828',
          aria: c.name + ' channel, ' + (c.ric || 'no instrument')
        };
      }),
      states: [
        Object.assign(seg(CH[1], { active: true, prices: true }), { title: 'Active', note: 'Workspace follows this channel. Ring in channel colour, search button attached.' }),
        Object.assign(seg(CH[0], { prices: true }), { title: 'Inactive', note: 'Flat on the track. Click to switch every bound panel to Red.' }),
        Object.assign(seg(CH[0], { prices: true, hover: true }), { title: 'Inactive · hover', note: 'Lifts to white; no ring until selected.' }),
        Object.assign(seg(CH[1], { active: true, prices: true, open: true }), { title: 'Active · search open', note: 'Search button tinted; dropdown hangs below. Click the RIC again to close.' }),
        Object.assign(seg(CH[3], {}), { title: 'Empty channel', note: 'Hollow dot. Selecting it opens search straight away.' }),
        Object.assign(seg(CH[3], { active: true }), { title: 'Empty · active', note: 'Bound panels show their empty state until a RIC is picked.' }),
        Object.assign(seg(CH[1], { prices: true, flash: 'up' }), { title: 'Tick up', note: 'Price flashes green for one tick (~500ms fade).' }),
        Object.assign(seg(CH[2], { prices: true, flash: 'down' }), { title: 'Tick down', note: 'Price flashes red. Change % keeps its arrow colour.' })
      ]
    };
  }
}
</script>
</body>
</html>
