<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Column sets swap columns and quick filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#3B5B8C}a:hover{color:#1E3A63}
button,input{font:inherit;color:inherit}
.r{--app:#EEF0F3;--panel:#FFFFFF;--bar:#F6F7F9;--border:#D9DDE3;--rowline:#F0F2F4;--fg:#1F2329;--fg2:#4A525D;--fg3:#5B6470;--hover:#E9ECF0;--sel:#E8EEF6;--field-border:#C3CAD3;--field-bg:#FFFFFF;--label-bg:#E4E8ED;--placeholder:#8A929D;--set-border:#8FA6C8;--set-label-bg:#DCE5F1;--accent:#3B5B8C;--focus:#3B5B8C;--toggle-bg:#D5DFEC;--toggle-fg:#1E3A63;--badge:#5A78A6;--x:#8A929D;--x-hover:#E6EAF0;--strong:#2B3440;--up:#1E7F45;--down:#B3261E;--flash:#FFF4CC;
font-family:'Nunito Sans',system-ui,sans-serif;font-size:11px;color:var(--fg);background:var(--app);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-bar{height:28px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 4px 0 6px;background:var(--bar);border-bottom:1px solid var(--border);min-width:0}
.fb-ico{width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--fg3);border:0;background:none;padding:0;border-radius:3px;position:relative;cursor:pointer}
.fb-ico:hover{background:var(--hover);color:var(--fg)}
.fb-ico.on{background:var(--toggle-bg);color:var(--toggle-fg)}
.fb-badge{position:absolute;top:-3px;right:-5px;min-width:12px;height:12px;box-sizing:border-box;padding:0 3px;border-radius:6px;background:var(--badge);color:#fff;font:700 8px/12px 'Nunito Sans',system-ui,sans-serif;text-align:center;box-shadow:0 0 0 1.5px var(--bar)}
.fb-box{height:20px;box-sizing:border-box;display:inline-flex;align-items:center;gap:4px;padding:0 6px 0 5px;border:1px solid var(--field-border);border-radius:3px;background:var(--field-bg);width:140px;flex:none;color:var(--placeholder)}
.fb-seg{height:20px;box-sizing:border-box;flex:none;display:inline-flex;align-items:stretch;border:1px solid var(--field-border);border-radius:3px;overflow:hidden;white-space:nowrap;padding:0;background:var(--field-bg);cursor:pointer}
.fb-sl{display:inline-flex;align-items:center;gap:6px;padding:0 6px;background:var(--label-bg);color:var(--fg2)}
.fb-si{display:inline-flex;align-items:center;gap:6px;min-width:40px;padding:0 6px;background:var(--field-bg);color:var(--placeholder)}
.fb-seg.set{border-color:var(--set-border)}
.fb-seg.set .fb-sl{background:var(--set-label-bg);color:var(--accent);font-weight:700}
.fb-seg.set .fb-si{color:var(--fg);font-weight:700;padding-right:2px}
.fb-x{display:inline-flex;flex:none;width:12px;height:12px;align-items:center;justify-content:center;border-radius:2px;color:var(--x);border:0;background:none;padding:0;cursor:pointer}
.fb-x:hover{background:var(--x-hover);color:var(--strong)}
.fb-extra{height:20px;box-sizing:border-box;flex:none;display:inline-flex;align-items:center;gap:5px;padding:0 3px 0 7px;border:1px dashed var(--set-border);border-radius:3px;color:var(--accent);font-weight:700;background:transparent;white-space:nowrap}
.th,.tr{height:24px;display:grid;gap:8px;align-items:center;padding:0 8px;border-bottom:1px solid var(--rowline)}
.th{background:var(--bar);font-weight:700;color:var(--fg2);border-bottom-color:var(--border)}
.tr:hover{background:var(--hover)}
.ft-tab{height:24px;padding:0 10px;border:0;background:transparent;border-radius:0 0 3px 3px;cursor:pointer;color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.ft-tab:hover{background:var(--hover)}
.ft-tab.on{background:var(--panel);color:var(--fg);font-weight:800;box-shadow:inset 0 -1px 0 var(--border),inset 1px 0 0 var(--border),inset -1px 0 0 var(--border)}
.kbd{font:inherit;font-size:10px;font-weight:400;min-width:14px;height:14px;padding:0 3px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--field-border);border-radius:3px;color:var(--fg2)}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{background:var(--flash)}100%{background:var(--bar)}}
</style>
</helmet>
<div class="r" style="width: 100%; height: 800px; padding: 10px; box-sizing: border-box; display: flex">
  <section aria-label="Instruments" style="flex: 1; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; min-width: 0">

    <div style="height: 28px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 4px; border-bottom: 1px solid var(--border)">
      <button aria-haspopup="menu" style="height: 24px; padding: 0 6px; display: flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: 3px; cursor: pointer">
        <span style="font-weight: 800; font-size: 12px">All instruments</span>
        <svg aria-hidden="true" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div class="{{barClass}}" role="toolbar" aria-label="Filters">
      <button class="fb-ico on" aria-pressed="true" aria-label="Quick filters">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4h7M12 4h2M2 8h2M7 8h7M2 12h9M14 12h0"></path><circle cx="10.5" cy="4" r="1.5"></circle><circle cx="5.5" cy="8" r="1.5"></circle><circle cx="12.5" cy="12" r="1.5"></circle></svg>
        <sc-if value="{{hasBadge}}" hint-placeholder-val="{{ true }}"><span class="fb-badge">{{badge}}</span></sc-if>
      </button>
      <span class="fb-box"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>Search</span>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
        <span style="display: inline-flex">
          <button class="{{f.cls}}" onClick="{{f.apply}}" title="{{f.title}}"><span class="fb-sl">{{f.label}}</span><span class="fb-si">{{f.value}}</span></button>
          <sc-if value="{{f.isSet}}" hint-placeholder-val="{{ false }}"><button class="fb-x" aria-label="{{f.clearLabel}}" onClick="{{f.clear}}" style="margin-left: -16px; align-self: center; position: relative"><svg width="8" height="8" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></sc-if>
        </span>
      </sc-for>
      <sc-if value="{{hasExtras}}" hint-placeholder-val="{{ true }}">
        <span aria-hidden="true" style="width: 1px; height: 16px; background: var(--border); flex: none"></span>
        <span style="color: var(--fg3); flex: none">Also applied</span>
        <sc-for list="{{extras}}" as="e" hint-placeholder-count="1">
          <span class="fb-extra" title="{{e.title}}">{{e.label}} {{e.value}}<button class="fb-x" aria-label="{{e.clearLabel}}" onClick="{{e.clear}}"><svg width="8" height="8" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></span>
        </sc-for>
      </sc-if>
      <span style="flex: 1"></span>
      <button class="fb-ico" aria-label="Choose quick filter columns" title="Quick filters of the {{setName}} column set"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"></rect><path d="M6 2.5v11M10 2.5v11"></path></svg></button>
    </div>

    <div class="th" style="{{gridStyle}}">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="8"><span class="{{c.cls}}">{{c.label}}</span></sc-for>
    </div>
    <div style="flex: 1; min-height: 0; overflow: auto">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
        <div class="tr" style="{{gridStyle}}">
          <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="8"><span class="{{cell.cls}}">{{cell.text}}</span></sc-for>
        </div>
      </sc-for>
      <sc-if value="{{noRows}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 32px; text-align: center; color: var(--fg3)">No rows match the filters</div>
      </sc-if>
    </div>

    <div style="height: 26px; flex: none; display: flex; align-items: flex-start; gap: 2px; padding: 0 6px; border-top: 1px solid var(--border); background: var(--bar)">
      <div role="tablist" aria-label="Column sets" style="display: flex; gap: 2px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
          <button class="{{t.cls}}" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.name}} <span class="kbd">{{t.key}}</span></button>
        </sc-for>
      </div>
      <button class="ft-tab" aria-label="New column set">+</button>
      <span style="flex: 1"></span>
      <span style="align-self: center; color: var(--fg3); margin-right: 8px">{{rowCount}}</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
const D = [
  { ric: 'BP.L', name: 'BP plc', exch: 'LSE', sector: 'Energy', type: 'Equity', ccy: 'GBP', bid: '468.10', ask: '468.30', last: '468.20', chg: 0.84, vol: '18.2M', mcap: 78, pe: 7.1, dy: 4.9, roe: 14.2 },
  { ric: 'SHEL.L', name: 'Shell plc', exch: 'LSE', sector: 'Energy', type: 'Equity', ccy: 'GBP', bid: '2,712.0', ask: '2,713.0', last: '2,712.5', chg: 0.41, vol: '9.6M', mcap: 214, pe: 11.8, dy: 3.9, roe: 12.6 },
  { ric: 'VOD.L', name: 'Vodafone Group', exch: 'LSE', sector: 'Communication', type: 'Equity', ccy: 'GBP', bid: '71.30', ask: '71.40', last: '71.36', chg: -1.12, vol: '41.0M', mcap: 19, pe: 9.4, dy: 7.6, roe: 3.1 },
  { ric: 'AZN.L', name: 'AstraZeneca', exch: 'LSE', sector: 'Health Care', type: 'Equity', ccy: 'GBP', bid: '11,840', ask: '11,846', last: '11,842', chg: 0.62, vol: '1.9M', mcap: 238, pe: 31.5, dy: 2.0, roe: 18.9 },
  { ric: 'GSK.L', name: 'GSK plc', exch: 'LSE', sector: 'Health Care', type: 'Equity', ccy: 'GBP', bid: '1,485.5', ask: '1,486.5', last: '1,486.0', chg: -0.31, vol: '6.4M', mcap: 74, pe: 13.2, dy: 3.8, roe: 41.0 },
  { ric: 'HSBA.L', name: 'HSBC Holdings', exch: 'LSE', sector: 'Financials', type: 'Equity', ccy: 'GBP', bid: '712.30', ask: '712.50', last: '712.40', chg: 0.95, vol: '22.7M', mcap: 162, pe: 7.9, dy: 6.8, roe: 13.4 },
  { ric: 'BARC.L', name: 'Barclays', exch: 'LSE', sector: 'Financials', type: 'Equity', ccy: 'GBP', bid: '268.10', ask: '268.20', last: '268.15', chg: 1.40, vol: '35.3M', mcap: 49, pe: 8.6, dy: 3.1, roe: 8.2 },
  { ric: 'ULVR.L', name: 'Unilever', exch: 'LSE', sector: 'Consumer Staples', type: 'Equity', ccy: 'GBP', bid: '4,630', ask: '4,632', last: '4,631', chg: -0.12, vol: '2.8M', mcap: 141, pe: 19.8, dy: 3.4, roe: 33.0 },
  { ric: 'RIO.L', name: 'Rio Tinto', exch: 'LSE', sector: 'Materials', type: 'Equity', ccy: 'GBP', bid: '5,212', ask: '5,214', last: '5,213', chg: 1.21, vol: '3.1M', mcap: 104, pe: 10.3, dy: 5.9, roe: 19.0 },
  { ric: 'XOM.N', name: 'Exxon Mobil Corp', exch: 'NYSE', sector: 'Energy', type: 'Equity', ccy: 'USD', bid: '112.34', ask: '112.38', last: '112.36', chg: -0.22, vol: '14.8M', mcap: 498, pe: 13.9, dy: 3.4, roe: 15.1 },
  { ric: 'CVX.N', name: 'Chevron Corp', exch: 'NYSE', sector: 'Energy', type: 'Equity', ccy: 'USD', bid: '158.05', ask: '158.09', last: '158.07', chg: -0.48, vol: '7.2M', mcap: 285, pe: 15.7, dy: 4.1, roe: 11.3 },
  { ric: 'AAPL.OQ', name: 'Apple Inc', exch: 'NASDAQ', sector: 'Info Tech', type: 'Equity', ccy: 'USD', bid: '228.50', ask: '228.54', last: '228.52', chg: 0.73, vol: '52.1M', mcap: 3480, pe: 34.6, dy: 0.4, roe: 147 },
  { ric: 'MSFT.OQ', name: 'Microsoft Corp', exch: 'NASDAQ', sector: 'Info Tech', type: 'Equity', ccy: 'USD', bid: '431.06', ask: '431.14', last: '431.10', chg: 0.18, vol: '19.4M', mcap: 3200, pe: 35.8, dy: 0.7, roe: 35.6 },
  { ric: 'SAP.DE', name: 'SAP SE', exch: 'Xetra', sector: 'Info Tech', type: 'Equity', ccy: 'EUR', bid: '214.60', ask: '214.70', last: '214.65', chg: -0.27, vol: '1.4M', mcap: 250, pe: 46.0, dy: 1.0, roe: 12.0 },
  { ric: 'TTE.PA', name: 'TotalEnergies SE', exch: 'Euronext', sector: 'Energy', type: 'Equity', ccy: 'EUR', bid: '61.82', ask: '61.86', last: '61.84', chg: 0.35, vol: '5.5M', mcap: 140, pe: 8.1, dy: 5.1, roe: 16.9 }
];
const FIELD = {
  exch: { label: 'Exchange', sample: 'LSE', test: (r, v) => r.exch === v },
  sector: { label: 'Sector', sample: 'Energy', test: (r, v) => r.sector === v },
  type: { label: 'Type', sample: 'Equity', test: (r, v) => r.type === v },
  ccy: { label: 'Currency', sample: 'GBP', test: (r, v) => r.ccy === v },
  mcap: { label: 'Mkt cap', sample: '> 100bn', test: (r) => r.mcap > 100 },
  pe: { label: 'P/E', sample: '< 15', test: (r) => r.pe < 15 },
  dy: { label: 'Div yld', sample: '> 3%', test: (r) => r.dy > 3 }
};
const pct = (c) => (c >= 0 ? '+' : '') + c.toFixed(2) + '%';
const COL = {
  ric: { label: 'RIC', w: '80px', v: (r) => r.ric, cls: () => '', bold: true },
  name: { label: 'Name', w: 'minmax(0,1fr)', v: (r) => r.name, cls: () => 'ell' },
  exch: { label: 'Exch', w: '70px', v: (r) => r.exch, cls: () => '' },
  sector: { label: 'Sector', w: '120px', v: (r) => r.sector, cls: () => 'ell' },
  bid: { label: 'Bid', w: '80px', v: (r) => r.bid, cls: () => 'num' },
  ask: { label: 'Ask', w: '80px', v: (r) => r.ask, cls: () => 'num' },
  last: { label: 'Last', w: '80px', v: (r) => r.last, cls: () => 'num' },
  chg: { label: 'Chg %', w: '64px', v: (r) => pct(r.chg), cls: (r) => 'num ' + (r.chg >= 0 ? 'up' : 'down') },
  vol: { label: 'Volume', w: '70px', v: (r) => r.vol, cls: () => 'num' },
  mcap: { label: 'Mkt cap $bn', w: '86px', v: (r) => r.mcap.toLocaleString(), cls: () => 'num' },
  pe: { label: 'P/E', w: '56px', v: (r) => r.pe.toFixed(1), cls: () => 'num' },
  dy: { label: 'Div yld %', w: '70px', v: (r) => r.dy.toFixed(1), cls: () => 'num' },
  roe: { label: 'ROE %', w: '60px', v: (r) => r.roe.toFixed(1), cls: () => 'num' }
};
const SETS = [
  { id: 'watch', name: 'Watchlist', key: 'Alt 1', cols: ['ric', 'name', 'exch', 'bid', 'ask', 'last', 'chg', 'vol'], quick: ['exch', 'sector', 'type'] },
  { id: 'screen', name: 'Screening', key: 'Alt 2', cols: ['ric', 'name', 'sector', 'mcap', 'pe', 'dy', 'roe', 'last'], quick: ['sector', 'mcap', 'pe', 'dy'] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { set: 'watch', vals: { exch: 'LSE', pe: '< 15' }, flash: 0 };
  }
  setVal(k, v) {
    const vals = { ...this.state.vals };
    if (v === undefined) delete vals[k]; else vals[k] = v;
    this.setState({ vals });
  }
  renderVals() {
    const s = this.state;
    const set = SETS.find((x) => x.id === s.set);
    const applied = Object.keys(s.vals);
    const rows = D.filter((r) => applied.every((k) => FIELD[k].test(r, s.vals[k])));
    const fields = set.quick.map((k) => {
      const v = s.vals[k];
      const notCol = !set.cols.includes(k);
      return {
        label: FIELD[k].label, value: v || 'Any', isSet: !!v,
        cls: 'fb-seg' + (v ? ' set' : ''),
        title: notCol ? FIELD[k].label + ' is a quick filter in this set but not one of its columns' : '',
        apply: () => { if (!v) this.setVal(k, FIELD[k].sample); },
        clearLabel: 'Clear ' + FIELD[k].label,
        clear: () => this.setVal(k, undefined)
      };
    });
    const extras = applied.filter((k) => !set.quick.includes(k)).map((k) => ({
      label: FIELD[k].label, value: s.vals[k],
      title: FIELD[k].label + ' is not a quick filter of ' + set.name + '. It still applies.',
      clearLabel: 'Clear ' + FIELD[k].label,
      clear: () => this.setVal(k, undefined)
    }));
    return {
      setName: set.name,
      barClass: 'fb-bar' + (s.flash % 2 ? ' flash' : ''),
      fields, extras, hasExtras: extras.length > 0,
      badge: applied.length, hasBadge: applied.length > 0,
      gridStyle: 'grid-template-columns: ' + set.cols.map((c) => COL[c].w).join(' '),
      cols: set.cols.map((c) => ({ label: COL[c].label, cls: COL[c].cls(D[0]).startsWith('num') ? 'num' : '' })),
      rows: rows.map((r) => ({ cells: set.cols.map((c) => ({ text: COL[c].v(r), cls: COL[c].cls(r) + (COL[c].bold ? '' : '') })) })),
      noRows: rows.length === 0,
      rowCount: rows.length + (rows.length === 1 ? ' row' : ' rows'),
      tabs: SETS.map((t) => ({
        name: t.name, key: t.key, on: t.id === s.set,
        cls: 'ft-tab' + (t.id === s.set ? ' on' : ''),
        pick: () => { if (t.id !== s.set) this.setState({ set: t.id, flash: s.flash + 1 }); }
      }))
    };
  }
}
</script>
</body>
</html>
