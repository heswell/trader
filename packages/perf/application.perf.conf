# Trading server (EXCHANGE + OMS) for the perf harness (src/perf-server.ts,
# started by src/ws-load.ts --target=local). Like packages/oms/application.conf:
# permissive auth, plain ws/http, but ports come from the env (free ports
# picked by the harness) and each load client logs in as its own user, so the
# per-user session limit is never hit. Dev/perf only.
vuu.ssl=false
vuu.websocket.path="/websocket-trading"
vuu.websocket.port=8095
vuu.https.port=8447
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
vuu.https.port=${?VUU_HTTPS_PORT}
vuu.auth.mode="permissive"
vuu.auth.path="/api/authn"
# ui-profile.ts serves the showcase build on a free port and passes its origin
# (comma-separated list).
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGINS}
vuu.server.maxSessionsPerUser=5
vuu.server.sessionLimitPolicy="reject-new"
vuu.log.level="warn"
vuu.log.level=${?VUU_LOG_LEVEL}

# Exchange simulator / OMS: EXCHANGE_SIM_* / OMS_* env vars override (the
# harness presets set them).
exchangeSim.activeInstruments=200
exchangeSim.seed=42
exchangeSim.mmRate=10
exchangeSim.takerRate=8
oms.seed=7
oms.flowRate=2
oms.collarPct=0.1
oms.markIntervalMs=500
oms.permissionMode="auto"
