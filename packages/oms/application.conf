# Stand-alone trading server: EXCHANGE + OMS (bun run --cwd packages/oms start).
# Permissive auth: any non-empty username/password is accepted and no roles are
# granted, so oms.permissionMode="auto" applies dev defaults. Dev only.
# With permissive auth vuu.ssl=false serves REST as plain http:// and the
# websocket as ws:// (no certificate needed).
vuu.ssl=false
vuu.websocket.path="/websocket-trading"
vuu.websocket.port=8095
vuu.https.port=8447
vuu.auth.mode="permissive"
vuu.auth.path="/api/authn"
vuu.auth.cors.allowedOrigin="http://localhost:5001"
# trace|debug|info|warn|error|silent (default info); vuu.log.levels.<logger> per name
vuu.log.level=${?VUU_LOG_LEVEL}

# Exchange simulator (EXCHANGE_SIM_<UPPER_SNAKE> env vars override).
exchangeSim.activeInstruments=200
exchangeSim.seed=42

# OMS (OMS_<UPPER_SNAKE> env vars override, e.g. OMS_FLOW_RATE=5).
# See packages/oms/README.md.
oms.seed=7
oms.flowRate=2
oms.flowAccounts=""
oms.flowNotionalUsd=25000
oms.flowMaxWorking=40
oms.flowCancelRate=0.25
oms.flowStepMs=100
oms.collarPct=0.1
oms.markIntervalMs=500
oms.restrictedRics=""
oms.permissionMode="auto"
oms.gatewayLatencyMs=0
