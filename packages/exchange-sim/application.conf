# Stand-alone exchange-sim server (bun run --cwd packages/exchange-sim start).
# Permissive auth: any username is accepted, with any (or no) password. Dev only.
# With permissive auth vuu.ssl=false serves REST as plain http:// and the
# websocket as ws:// (no certificate needed).
vuu.ssl=false
vuu.websocket.path="/websocket-exchange-sim"
vuu.websocket.port=8094
vuu.https.port=8446
vuu.auth.mode="permissive"
vuu.auth.path="/api/authn"
# The showcase dev server (apps/showcase) calls vuu.auth.path directly.
vuu.auth.cors.allowedOrigins=["http://localhost:5001", "http://127.0.0.1:5001"]
# Sessions per user (vuu-server 4.1.0). Each browser tab holds one session on
# each server, so allow a few tabs; a further login is refused (closed with
# 4003). Not "evict-oldest": vuu-ui reconnects evicted tabs, which then evict
# the next oldest in turn (upstream issue 73).
vuu.server.maxSessionsPerUser=5
vuu.server.sessionLimitPolicy="reject-new"
# trace|debug|info|warn|error|silent (default info); vuu.log.levels.<logger> per name
vuu.log.level=${?VUU_LOG_LEVEL}
# comma-separated list; replaces allowedOrigins
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGINS}
vuu.server.maxSessionsPerUser=${?VUU_MAX_SESSIONS_PER_USER}
vuu.server.sessionLimitPolicy=${?VUU_SESSION_LIMIT_POLICY}

# Exchange simulator (EXCHANGE_SIM_<UPPER_SNAKE> env vars override, e.g.
# EXCHANGE_SIM_ACTIVE_INSTRUMENTS=50). See packages/exchange-sim/README.md.
exchangeSim.activeInstruments=200
exchangeSim.instruments=""
exchangeSim.seed=42
exchangeSim.botStepMs=20
exchangeSim.maxStepMs=250
exchangeSim.maxOpsPerStep=5000
exchangeSim.publishIntervalMs=100
exchangeSim.depthLevels=10
exchangeSim.tradesCapacity=50000
# Chart data (docs/charting-data.md): OHLCV bars and periodic book samples.
exchangeSim.barIntervals="1s,1m,5m"
exchangeSim.barHistory=500
exchangeSim.barBackfill=1
exchangeSim.bookSampleIntervalMs=1000
exchangeSim.bookSampleHistory=300
exchangeSim.priceBandPct=0.2
exchangeSim.timeScale=10
exchangeSim.defaultVolatility=0
exchangeSim.mmPerInstrument=2
exchangeSim.mmLevels=5
exchangeSim.mmRate=10
exchangeSim.takerRate=8
exchangeSim.baseNotionalUsd=20000
