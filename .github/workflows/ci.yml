name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test

      # portal-build.json / default-modules.yaml in sync with the feature catalog
      - name: Features check
        run: bun run features:check

      # docs/api generated from the sources is current; every reusable
      # component has a showcase example and guide; relative links resolve
      - name: Docs check
        run: bun run docs:check

      - name: Build portal host and trading features
        run: bun run build

      # WS throughput smoke (5 clients x 5 viewports against an in-process
      # perf server, ~20s). Thresholds are loose; see docs/performance.md.
      - name: Perf smoke (WS load)
        run: bun run perf:ws --preset=smoke --assert
