# Config for the stock vuu-portal server:
#   bunx vuu-portal --config apps/portal-config/application.conf
# All relative paths (certs, module files) resolve against this directory.
# Ports / origins match `bun run start:all` defaults (scripts/stack/config.ts),
# chosen to run beside a stock vuu-websocket / vuu-ui checkout. The VUU_* env
# vars at the end override them; start:all sets those from its TRADER_* settings
# (scripts/stack/config.ts serverEnv). Keycloak clients as in vuu-websocket's
# own portal. The trading tables are served by a second Vuu server:
# application.trading.conf.
vuu.certPath="./certs/cert.pem"
vuu.keyPath="./certs/key.pem"
vuu.ssl=true
vuu.websocket.path="/websocket-portal"
vuu.websocket.port=8191
vuu.https.port=8543
vuu.auth.mode="keycloak"
vuu.auth.path="/api/authn"
vuu.auth.cors.allowedOrigin="http://localhost:5100"
vuu.auth.keycloak.clientId="vuu-portal-server"
vuu.auth.keycloak.audience="vuu-portal-server"
vuu.auth.keycloak.audiencePolicy="require-audience"
vuu.auth.keycloak.authorizationClientId="vuu-portal"
vuu.auth.keycloak.expectedAuthorizedParty="vuu-portal"
vuu.auth.keycloak.tokenExchangeEnabled=false
vuu.auth.keycloak.clientSecret="vuu-portal-local-dev-secret"
# default-modules.yaml (generated from apps/features/trading/src/catalog.ts) seeds
# modules.yaml on first start; modules.yaml is then runtime state (gitignored,
# edited by the module admin). start:all reseeds it when the defaults change.
vuu.portal.defaultModulesFile="default-modules.yaml"
vuu.portal.modulesFile="modules.yaml"
vuu.portal.moduleAdminRole="module-admin-access"
vuu.keycloak.url="https://localhost:8180"
vuu.keycloak.realm="vuu"
vuu.keycloak.allowSelfSignedCert=true

# Sessions per user (vuu-server 4.1.0). Each browser tab holds one session on
# each server, so allow a few tabs; a further login is refused (closed with
# 4003). Not "evict-oldest": vuu-ui reconnects evicted tabs, which then evict
# the next oldest in turn (upstream issue 73).
vuu.server.maxSessionsPerUser=5
vuu.server.sessionLimitPolicy="reject-new"

# Optional env overrides (ignored when unset).
vuu.https.port=${?VUU_HTTPS_PORT}
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
vuu.auth.cors.allowedOrigin=${?VUU_CORS_ALLOWED_ORIGIN}
vuu.keycloak.url=${?VUU_KEYCLOAK_URL}
# trace|debug|info|warn|error|silent (default info); vuu.log.levels.<logger> per name
vuu.log.level=${?VUU_LOG_LEVEL}
vuu.server.maxSessionsPerUser=${?VUU_MAX_SESSIONS_PER_USER}
vuu.server.sessionLimitPolicy=${?VUU_SESSION_LIMIT_POLICY}
vuu.portal.defaultModulesFile=${?VUU_PORTAL_DEFAULT_MODULES_FILE}
vuu.portal.modulesFile=${?VUU_PORTAL_MODULES_FILE}
