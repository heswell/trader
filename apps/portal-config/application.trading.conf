# Trading Vuu server: exchange-sim (EXCHANGE) + OMS, a separate process from the
# portal server (src/start-trading.ts). The trading modules connect to it via
# the config.json each remote publishes next to its mf-manifest.json
# (scripts/stack/config.ts featureConfigJson). The VUU_* env vars below
# override ports / origins; start:all sets them from its TRADER_* settings
# (scripts/stack/config.ts serverEnv). Relative paths resolve against this
# directory.
#
# Auth: the portal host POSTs the user's Keycloak token (client vuu-portal, with
# this client in its audience) to vuu.auth.path; the server exchanges it for a
# token of its own confidential client trader-trading-server and reads the
# user's trading roles from that client (infra/keycloak/realm-vuu.json).
vuu.certPath="./certs/cert.pem"
vuu.keyPath="./certs/key.pem"
vuu.ssl=true
vuu.websocket.path="/websocket-trading"
vuu.websocket.port=8192
vuu.https.port=8544
vuu.auth.mode="keycloak"
vuu.auth.path="/api/authn"
# Origins allowed to call vuu.auth.path: the portal host and the features
# server (start:all defaults), via localhost and 127.0.0.1.
vuu.auth.cors.allowedOrigins=["http://localhost:5100", "http://127.0.0.1:5100", "http://localhost:5110", "http://127.0.0.1:5110"]
vuu.auth.keycloak.clientId="trader-trading-server"
vuu.auth.keycloak.audience="trader-trading-server"
vuu.auth.keycloak.audiencePolicy="always-exchange"
vuu.auth.keycloak.authorizationClientId="trader-trading-server"
vuu.auth.keycloak.expectedAuthorizedParty="trader-trading-server"
vuu.auth.keycloak.tokenExchangeEnabled=true
vuu.auth.keycloak.clientSecret="trader-trading-local-dev-secret"
vuu.keycloak.url="https://localhost:8180"
vuu.keycloak.realm="vuu"
vuu.keycloak.allowSelfSignedCert=true

# Sessions per user (vuu-server 4.1.0). Each browser tab holds one session on
# each server, so allow a few tabs; a further login is refused (closed with
# 4003). Not "evict-oldest": vuu-ui reconnects evicted tabs, which then evict
# the next oldest in turn (upstream issue 73).
vuu.server.maxSessionsPerUser=5
vuu.server.sessionLimitPolicy="reject-new"

# Optional env overrides (ignored when unset).
vuu.https.port=${?VUU_HTTPS_PORT}
vuu.websocket.port=${?VUU_WEBSOCKET_PORT}
# comma-separated list; replaces allowedOrigins
vuu.auth.cors.allowedOrigins=${?VUU_CORS_ALLOWED_ORIGINS}
vuu.keycloak.url=${?VUU_KEYCLOAK_URL}
# trace|debug|info|warn|error|silent (default info); vuu.log.levels.<logger> per name
vuu.log.level=${?VUU_LOG_LEVEL}
vuu.server.maxSessionsPerUser=${?VUU_MAX_SESSIONS_PER_USER}
vuu.server.sessionLimitPolicy=${?VUU_SESSION_LIMIT_POLICY}
vuu.auth.keycloak.clientSecret=${?TRADER_TRADING_CLIENT_SECRET}

# Exchange simulator knobs (defaults shown; EXCHANGE_SIM_<UPPER_SNAKE> env vars
# override). See packages/exchange-sim/README.md for the full list.
exchangeSim.activeInstruments=200
exchangeSim.seed=42
exchangeSim.mmRate=10
exchangeSim.takerRate=8

# OMS knobs (defaults shown; OMS_<UPPER_SNAKE> env vars override).
# Users need the trader-trading-server client roles trading-view /
# trading-execute / trading-supervisor; see packages/oms/README.md. strict: no
# trading role, no rows and no orders.
oms.flowRate=2
oms.collarPct=0.1
oms.markIntervalMs=500
oms.permissionMode="strict"
